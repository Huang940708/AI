<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 猜數字遊戲</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Noto Sans TC', Arial, sans-serif;
            background: linear-gradient(135deg, #f7e8ff 0%, #e0f7fa 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 420px;
            margin: 60px auto 0 auto;
            background: #fffbe7;
            border-radius: 28px;
            box-shadow: 0 8px 32px #b39ddb44, 0 1.5px 4px #0001;
            padding: 38px 30px 28px 30px;
            position: relative;
            border: 2.5px solid #ffd54f;
            animation: fadeIn 1s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            text-align: center;
            color: #7c43bd;
            font-size: 2.4rem;
            letter-spacing: 2.5px;
            margin-bottom: 8px;
            font-weight: 800;
            text-shadow: 0 2px 8px #e1bee7;
        }
        .subtitle {
            text-align: center;
            color: #ff9800;
            margin-bottom: 22px;
            font-size: 1.12rem;
            font-weight: 600;
        }
        #chat {
            height: 320px;
            overflow-y: auto;
            border: 2px dashed #ffd54f;
            border-radius: 16px;
            padding: 18px 14px;
            background: linear-gradient(120deg, #fffde7 80%, #ffe0b2 100%);
            margin-bottom: 20px;
            box-shadow: 0 1px 8px #ffe08299;
        }
        .msg {
            margin: 14px 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .msg .user {
            color: #1976d2;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .msg .ai {
            color: #ff9800;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .msg.user-msg {
            align-items: flex-end;
        }
        .msg.user-msg .bubble {
            background: linear-gradient(90deg, #e1bee7 60%, #b39ddb 100%);
            color: #222;
            border-radius: 20px 20px 8px 20px;
            padding: 13px 20px;
            max-width: 80%;
            margin-left: 40px;
            box-shadow: 0 2px 8px #b39ddb33;
            font-size: 1.12rem;
            word-break: break-word;
        }
        .msg.ai-msg .bubble {
            background: linear-gradient(90deg, #fff9c4 60%, #ffe082 100%);
            color: #7c43bd;
            border-radius: 20px 20px 20px 8px;
            padding: 13px 20px;
            max-width: 80%;
            margin-right: 40px;
            box-shadow: 0 2px 8px #ffd54f33;
            font-size: 1.12rem;
            word-break: break-word;
        }
        #inputArea {
            display: flex;
            gap: 12px;
        }
        #userInput {
            flex: 1;
            padding: 13px 15px;
            border-radius: 12px;
            border: 2px solid #ffd54f;
            font-size: 1.12rem;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 4px #ffd54f22;
            background: #fffde7;
        }
        #userInput:focus {
            border: 2px solid #7c43bd;
            box-shadow: 0 2px 8px #b39ddb33;
        }
        #sendBtn {
            padding: 13px 28px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #ffd54f 60%, #ffb300 100%);
            color: #7c43bd;
            font-size: 1.12rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 2px 8px #ffd54f33;
            transition: background 0.2s, box-shadow 0.2s;
        }
        #sendBtn:disabled {
            background: #ffe082;
            color: #bdbdbd;
            cursor: not-allowed;
            box-shadow: none;
        }
        #apiKey {
            width: 100%;
            margin-bottom: 16px;
            padding: 13px 15px;
            border-radius: 12px;
            border: 2px solid #ffd54f;
            font-size: 1.12rem;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 4px #ffd54f22;
            background: #fffde7;
        }
        #apiKey:focus {
            border: 2px solid #7c43bd;
            box-shadow: 0 2px 8px #b39ddb33;
        }
        #apiKey {
            display: none;
        }
        /* 捲軸美化 */
        #chat::-webkit-scrollbar {
            width: 8px;
        }
        #chat::-webkit-scrollbar-thumb {
            background: #ffe082;
            border-radius: 6px;
        }
        #chat::-webkit-scrollbar-track {
            background: #fffde7;
        }
        /* 手機響應式 */
        @media (max-width: 600px) {
            .container {
                max-width: 98vw;
                padding: 10vw 2vw 6vw 2vw;
            }
            #chat {
                height: 48vw;
                min-height: 220px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI 猜數字遊戲</h1>
        <div class="subtitle">和 AI 一起玩 1~100 的猜數字遊戲，輸入「開始遊戲」或直接猜數字！</div>
        <input id="apiKey" type="password" placeholder="請輸入你的 Google AI API Key" />
        <div id="chat"></div>
        <div id="inputArea">
            <input id="userInput" type="text" placeholder="輸入「開始遊戲」或猜一個 1~100 的數字..." />
            <button id="sendBtn">送出</button>
        </div>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKey');

        let gameActive = false;
        let answer = null;
        let guessCount = 0;

        function appendMsg(sender, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + (sender === 'user' ? 'user-msg' : 'ai-msg');
            div.innerHTML = `<span class="${sender}">${sender === 'user' ? '你' : 'AI'}：</span><div class="bubble">${text.replace(/\n/g, '<br>')}</div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function aiGameReply(msg) {
            if (!gameActive && /開始|start/i.test(msg)) {
                answer = Math.floor(Math.random() * 100) + 1;
                guessCount = 0;
                gameActive = true;
                return '遊戲開始！我已經想好 1~100 的數字，請猜一個數字。';
            }
            if (!gameActive) {
                return '請輸入「開始遊戲」來開始猜數字！';
            }
            const num = parseInt(msg, 10);
            if (isNaN(num) || num < 1 || num > 100) {
                return '請輸入 1~100 的整數來猜數字。';
            }
            guessCount++;
            if (num === answer) {
                gameActive = false;
                return `恭喜你猜對了！答案就是 ${answer}，你總共猜了 ${guessCount} 次。\n輸入「開始遊戲」再玩一次！`;
            } else if (num < answer) {
                return '太小了，再大一點！';
            } else {
                return '太大了，再小一點！';
            }
        }

        sendBtn.onclick = async () => {
            const msg = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            if (!msg) return;
            appendMsg('user', msg);
            userInput.value = '';
            sendBtn.disabled = true;
            // 遊戲本地處理，不呼叫 API
            setTimeout(() => {
                const aiReply = aiGameReply(msg);
                appendMsg('ai', aiReply);
                sendBtn.disabled = false;
            }, 400);
        };

        userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>
